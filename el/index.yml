plugins:
  default:
    # - rss
    - answer
    # - cli
    - limit
    - forward
    # - dev
    # - teach
  official:
    - setu
    # - hitokoto
    # - niubi
  custom:
    - ./plugins/custom/search-anime
    - ./plugins/custom/search-image
    - ./plugins/custom/invited-bot
    - ./plugins/custom/kugimiya-voice
    - ./plugins/custom/tiangou
    - ./plugins/custom/music
    - ./plugins/custom/mapi
    - ./plugins/custom/sleep
    - ./plugins/custom/help
    # - ./bot/test

# 主人
master:
  - 454693264

# 限制
limit:
  interval: 20000
  count: 10
  sender:
    # 连续次数
    maximum: 3
    tooltip: 我生气了！
    time: 2400

# 搜图
search-image:
  token: 27b5bbc3450e354540e56852bfd5dce0b2a8b726
  options:
    results: 2 # 结果数

cache:
  cron: '0 0 2 * * *'

# 搜番
search-anime:
  token: fc0751d63c9b56b0c346ae8c4893bed576d8a2f9

# 色图
setu:
  url: https://api.lolicon.app/setu/?apikey=877789775f5c596fa93852
  # proxy: https://images.weserv.nl/?url=
  match:
    - is: 
      - 不够色
      - 涩图
      - 色图
    - includes:
      - 来
      - 色图
    - includes:
      - 来
      - 涩图
  reply: 让我找找

# 帮助
help:
  match:
    - is: 
      - 帮助
      - help
      - 指令

# 舔狗
tiangou:
  match:
    - is:
      - 舔狗日记
      - 舔狗日志

# 消息应答
answer:
  - is: 
    - 一言
    - 骚话
    api: https://v1.hitokoto.cn/
    reply: ${data.hitokoto} ——「${data.from}」
